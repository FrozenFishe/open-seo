services:
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      # Lets the startup checks warn when the port binds beyond this machine.
      - HOST_IP=${HOST_IP:-}
      # Optional: shared secret /mcp requires (Authorization: Bearer <token> or
      # x-api-key: <token>). Set it whenever HOST_IP is not 127.0.0.1.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Optional: AI features (SAM, setup research, Prompt Research, prompt
      # suggestions). Without these the in-app setup gate asks for the key.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Optional: point every AI feature at a self-hosted OpenAI-compatible
      # endpoint (e.g. local vLLM) instead of OpenRouter. When set, no
      # OpenRouter key is needed; set OPENROUTER_MODEL to the served model.
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - VITE_SHOW_DEVTOOLS=false
    # Lets the container reach services on the Docker host (e.g. a local
    # OpenAI-compatible LLM at http://host.docker.internal:8000/v1). Docker
    # Desktop provides this name already; Linux Docker Engine needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_IP:-127.0.0.1}:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
